  <style>
    * { box-sizing: border-box; }
    body {

    .not-found-card {
      width: min(540px, 100%);

    }

      margin: 0 0 28px;
      color: #4B5751;
      line-height: 1.72;
    }
    .not-found-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 20px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .btn-primary {
